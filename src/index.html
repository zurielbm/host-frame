<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'"><title>Hostframe</title><link rel="stylesheet" href="styles.css"></head>
<body data-edge="bottom" data-mode="strip" data-side="left">
<div id="workspace"></div>
<aside id="drawer" class="drawer"></aside>
<div id="dock" class="dock">
  <button class="grip" id="dock-grip" title="Drag to move the dock" aria-label="Move dock"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg></button>
  <button class="env" id="env-btn" title="Environment"><span class="edot" id="env-dot"></span><span id="env-name">Local</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <span class="div"></span>
  <div class="users" id="users"></div>
  <span class="div"></span>
  <div class="tools">
    <button class="tbtn" data-tool="layout" title="Layout"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M12 3v18M3 12h18"/></svg></button>
    <button class="tbtn" data-tool="open" title="Open pane"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M12 8v8M8 12h8"/></svg></button>
    <button class="tbtn" data-tool="gear" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="agent" id="agent-toggle" title="Agent access"><span class="adot"></span></button>
    <button class="tbtn" id="dock-expand" title="Open drawer (Ctrl+Shift+S)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16M6 9h1M6 12h1"/></svg></button><button class="tbtn min" id="dock-min" title="Hide dock (Ctrl+.)"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
</div>
<button id="dock-handle" class="dock-handle" title="Show dock (Ctrl+.)" aria-label="Show dock"><span class="edot" id="handle-dot"></span></button>
<div id="pop" class="pop" hidden></div>
<dialog id="dialog"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="Close">×</button></div><div id="dialog-body"></div></dialog><div id="toast" role="status"></div><script src="renderer.js"></script></body></html>
